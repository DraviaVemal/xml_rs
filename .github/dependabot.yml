version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/lib"
    exclude-paths:
      - "tests/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
      cargo-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]